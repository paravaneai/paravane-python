[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paravane"
version = "1.0.2"
description = "Python SDK for the Paravane API."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Paravane Labs", email = "contact@paravane.io"}
]
keywords = ["paravane", "smtprs", "email risk", "api", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "requests>=2.33.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.1",
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "setuptools>=77.0",
  "tomli>=2.0.0; python_version < '3.11'",
  "twine>=5.1.0",
  "wheel",
]

[project.urls]
Homepage = "https://paravane.io"
Documentation = "https://github.com/paravaneai/paravane-python#documentation"
Changelog = "https://github.com/paravaneai/paravane-python/blob/main/CHANGELOG.md"
Source = "https://github.com/paravaneai/paravane-python"
Issues = "https://github.com/paravaneai/paravane-python/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paravane = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
